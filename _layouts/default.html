<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.math %}
  <script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  {% assign home = '/' | relative_url %}
  <header class="sitenav">
    <div class="sitenav-inner">
      <a class="sitenav-name" href="{{ home }}">Chethan Krishnamurthy Ramanaik</a>
      <nav class="sitenav-links">
        <a href="{{ home }}#about-me">About</a>
        <a href="{{ home }}#publications">Publications</a>
        <a href="{{ home }}#research-projects">Projects</a>
        <a href="{{ home }}#experience">Experience</a>
        <a href="{{ home }}#talks-and-events">Talks</a>
      </nav>
    </div>
  </header>
  <main class="page {{ page.class }}">
    {{ content }}
  </main>
  {% if page.url == '/' %}
  <script>
    // Highlight the nav item of the section currently on screen
    (function () {
      var links = document.querySelectorAll('.sitenav-links a');
      var map = {};
      links.forEach(function (a) { map[a.getAttribute('href').split('#')[1]] = a; });
      var heads = Array.prototype.slice.call(document.querySelectorAll('.page h2[id]'));
      function update() {
        var active = null;
        heads.forEach(function (h) { if (map[h.id] && h.getBoundingClientRect().top < 140) active = h.id; });
        links.forEach(function (a) { a.classList.remove('active'); });
        if (active && map[active]) map[active].classList.add('active');
      }
      window.addEventListener('scroll', update, { passive: true });
      update();
    })();
  </script>
  {% endif %}
  <footer class="footer">© {{ site.time | date: '%Y' }} Chethan Krishnamurthy Ramanaik</footer>
</body>
</html>
